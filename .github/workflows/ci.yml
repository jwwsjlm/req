name: CI

on:
  push:
    branches:
    - master
    paths-ignore:
    - '**.md'
  pull_request:
    branches:
    - master
    paths-ignore:
    - '**.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.7'
        cache: true
    - name: Test
      run: go test ./... -coverprofile=coverage.txt
    - name: Test example modules
      shell: bash
      run: |
        for module in examples/*/go.mod examples/*/*/go.mod; do
          (cd "$(dirname "$module")" && go test ./...)
        done
    - name: Static analysis
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
        go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
        for module in go.mod examples/*/go.mod examples/*/*/go.mod; do
          (cd "$(dirname "$module")" && staticcheck ./... && govulncheck ./...)
        done
